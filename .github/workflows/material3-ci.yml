name: Material3 dependency compatibility
on:
  push:
    branches: [wip/material3-toolchain-ci-20261115]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;36.0.0"'
      - name: Check resolved Material3 and run build, tests, lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=1 :app:dependencyInsight --dependency androidx.compose.material3:material3-android --configuration debugRuntimeClasspath | tee material3-resolution.txt
          grep -q 'androidx.compose.material3:material3-android:1.5.0-rc01' material3-resolution.txt
          ./gradlew --no-daemon --max-workers=1 --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Save resolution and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: material3-dependency-report-${{ github.sha }}
          path: |
            material3-resolution.txt
            app/build/reports/
          if-no-files-found: warn
          retention-days: 2
