name: Isolated Studio consent fixture

on:
  push:
    branches: [wip/studio-consent-fixture-ci-20261115]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install isolated fixture SDK requirements
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"'
      - name: Fetch and verify pinned Kotlin compiler dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consent-fixture-jars"
          while read -r digest path; do
            file="$RUNNER_TEMP/consent-fixture-jars/${path##*/}"
            curl --fail --silent --show-error --location --retry 3 "https://repo.maven.apache.org/maven2/$path" --output "$file"
            printf '%s  %s\n' "$digest" "$file" | sha256sum --check --status
          done <<'JARS'
          1c6c3f810bfe6a41abcbc34b3a2ef639f1e3f4aeed3a953a4b0974eea4f41889 org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.20/kotlin-compiler-embeddable-2.2.20.jar
          8836ccffd3585fadda9901244b20d42901d2f3cd581058d8434e2ffabcf3a3e7 org/jetbrains/kotlin/kotlin-stdlib/2.2.20/kotlin-stdlib-2.2.20.jar
          5c8bd5dd7ae1ea2eeb2778fdbeaa19a562184975f6cab8a0bb6779e4190731ae org/jetbrains/kotlin/kotlin-script-runtime/2.2.20/kotlin-script-runtime-2.2.20.jar
          3277ac102ae17aad10a55abec75ff5696c8d109790396434b496e75087854203 org/jetbrains/kotlin/kotlin-reflect/1.6.10/kotlin-reflect-1.6.10.jar
          7c5c8cd2f8beadd3283239bb9ca219a0cafa1af02682b407b181e1179718f2f7 org/jetbrains/kotlin/kotlin-daemon-embeddable/2.2.20/kotlin-daemon-embeddable-2.2.20.jar
          9860906a1937490bf5f3b06d2f0e10ef451e65b95b269f22daf68a3d1f5065c5 org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.8.0/kotlinx-coroutines-core-jvm-1.8.0.jar
          ace2a10dc8e2d5fd34925ecac03e4988b2c0f851650c94b8cef49ba1bd111478 org/jetbrains/annotations/13.0/annotations-13.0.jar
          f31cc53f105a7e48c093683bbd5437561d1233920513774b470805641bedbc09 org/jetbrains/kotlin/kotlin-stdlib/2.0.21/kotlin-stdlib-2.0.21.jar
          JARS
      - name: Build and inspect only the disposable fixture APK
        shell: bash
        env:
          CONSENT_FIXTURE_JAR_DIR: ${{ runner.temp }}/consent-fixture-jars
          CONSENT_FIXTURE_ARTIFACT: ${{ runner.temp }}/studio-consent-appuid-fixture.apk
        run: |
          set -euo pipefail
          python3 experiments/studio-owned-consent-appuid/build-fixture.py
          apk="$CONSENT_FIXTURE_ARTIFACT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='de.kontrakurs.studioconsentfixture'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -F 'uses-permission:'; then
            echo 'Fixture unexpectedly requests permissions' >&2; exit 1
          fi
          sha256sum "$apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-consent-test-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/studio-consent-appuid-fixture.apk
          if-no-files-found: error
          retention-days: 3
