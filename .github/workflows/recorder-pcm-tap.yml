name: Isolated recorder PCM tap WIP
on:
  push:
    branches: ["wip/recorder-pcm-tap-20261115"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug app and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Verify bounded PCM hot path
        run: bash scripts/test-pcm-tap.sh
      - uses: actions/upload-artifact@v4
        with:
          name: recorder-pcm-tap-wip-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
