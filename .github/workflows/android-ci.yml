name: Android test and unsigned APK

on:
  push:
    branches:
      - wip/ci-manual-remote-20261114

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out this revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Run unit tests and assemble unsigned APK
        run: |
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug -PciUnsigned=true
          test -s app/build/outputs/apk/debug/app-debug-unsigned.apk
          test -s app/build/reports/tests/testDebugUnitTest/index.html
          sha256sum app/build/outputs/apk/debug/app-debug-unsigned.apk
      - name: Upload unsigned APK and test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kontraprompter-unsigned-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*-unsigned.apk
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 2
