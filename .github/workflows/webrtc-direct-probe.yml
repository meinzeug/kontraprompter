name: Direct video network probe
on:
  push:
    branches: [wip/webrtc-direct-network-probe-ci-20261115]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Build debug probe
        run: ./gradlew --no-daemon --max-workers=1 :app:assembleDebug
      - name: Save probe APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-video-probe-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 2
